name: Build and Deploy to GCS and GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: static-site-deployment
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Upload static site to GCS
        run: gcloud storage rsync --recursive --delete-unmatched-destination-objects dist gs://login_gcp_front_end

      - name: Set cache-control for entry HTML
        run: |
          gcloud storage objects update gs://login_gcp_front_end/index.html --cache-control="no-cache,max-age=0,must-revalidate"
          gcloud storage objects update gs://login_gcp_front_end/404.html --cache-control="no-cache,max-age=0,must-revalidate"

      - name: Set cache-control for static assets
        run: gcloud storage objects update "gs://login_gcp_front_end/assets/*" --cache-control="public,max-age=31536000,immutable"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
